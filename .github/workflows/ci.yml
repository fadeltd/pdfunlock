name: CI

on:
  pull_request:
    # labeled/unlabeled so adding or removing skip-changelog re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Cancel superseded runs on the same ref: only the latest push matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      # Every PR that changes the tool or its packages needs an entry under
      # [Unreleased], because that section is what the next release is cut
      # from. Docs, the website, CI, release tooling and local build files
      # ship without a release, so they are exempt, and so is a PR labelled
      # skip-changelog.
      - name: Require a CHANGELOG.md entry
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = "true" ]; then
            echo "::notice::skip-changelog label set; not checking CHANGELOG.md."
            exit 0
          fi

          files=$(gh pr diff "$PR" --name-only)
          exempt='^(LICENSE|\.gitignore|Makefile|env\.sample|[^/]*\.md|docs/.*|\.github/.*|scripts/.*)$'
          needs=$(echo "$files" | grep -Ev "$exempt" || true)
          if [ -z "$needs" ]; then
            echo "::notice::Only exempt files changed; no changelog entry needed."
            exit 0
          fi

          if ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "These files change the tool or its packages:"
            while IFS= read -r f; do echo "  $f"; done <<<"$needs"
            echo "::error file=CHANGELOG.md::Add an entry under ## [Unreleased] in CHANGELOG.md, or label the PR skip-changelog if it should not be released."
            exit 1
          fi

          preview=$(go run ./scripts/release -dry-run)
          echo "$preview"
          if ! grep -q '^bump' <<<"$preview"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md changed, but ## [Unreleased] has no ### section with bullets under it."
            exit 1
          fi

  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on: $unformatted"
            exit 1
          fi

      - name: Vet, test and build
        run: |
          go vet ./...
          go test ./...
          go build -o /dev/null .

      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
