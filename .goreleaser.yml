# GoReleaser configuration for pdfunlock
version: 2

project_name: pdfunlock

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Exclude unsupported combinations
    ignore:
      - goos: windows
        goarch: arm64
    binary: pdfunlock
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    main: ./

# UPX compression disabled by default to avoid antivirus false positives
# UPX-compressed binaries are often flagged as malicious by security vendors
# since malware commonly uses packing to evade detection.
# To enable UPX compression, set ENABLE_UPX=true when building:
#   ENABLE_UPX=true goreleaser build --snapshot
# Note: This may cause false positive detections with antivirus software.

archives:
  # Default archive for all platforms (tar.gz for unix, handled by GoReleaser)
  - name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*
    # Don't wrap in directory to keep binaries at top level
    wrap_in_directory: false

checksum:
  name_template: 'checksums.txt'

# Homebrew cask in fadeltd/homebrew-tap: brew install --cask fadeltd/tap/pdfunlock
# Pushed over SSH with a deploy key (HOMEBREW_TAP_DEPLOY_KEY secret)
homebrew_casks:
  - name: pdfunlock
    directory: Casks
    binaries:
      - pdfunlock
    description: "Unlock password-protected PDF files from the command-line"
    homepage: "https://fadeltd.github.io/pdfunlock/"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "pdfunlock {{ .Tag }}"
    # Prereleases (e.g. v1.0.0-alpha.1) never reach the tap
    skip_upload: auto
    repository:
      owner: fadeltd
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:fadeltd/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    # The binary is unsigned and not notarized, so drop the quarantine
    # attribute to let it run straight after install. Homebrew 7 deprecates
    # the `postflight` block that `hooks.post.install` generates, so write
    # `postflight_steps` directly. GoReleaser puts custom_block at the top of
    # the cask, so `brew style` reports Cask/StanzaOrder; that is cosmetic.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:           ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/pdfunlock"],
              writable_paths: ["pdfunlock"]
        end
      end

# snapshot configuration (uses defaults)

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - '^refactor:'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
  name_template: 'Release {{ .Tag }}'
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Release {{ .Tag }}
    
    ### Downloads
    
    Choose the appropriate binary for your platform:
    
    - **Linux (x86_64)**: `pdfunlock_Linux_x86_64.tar.gz`
    - **Linux (ARM64)**: `pdfunlock_Linux_arm64.tar.gz`
    - **Windows (x86_64)**: `pdfunlock_Windows_x86_64.zip`
    - **macOS (Intel)**: `pdfunlock_Darwin_x86_64.tar.gz`
    - **macOS (Apple Silicon)**: `pdfunlock_Darwin_arm64.tar.gz`
    
    ### Installation
    
    1. Download the appropriate archive for your platform
    2. Extract the binary
    3. Make it executable (Linux/macOS): `chmod +x pdfunlock`
    4. Optionally, move to your PATH: `sudo mv pdfunlock /usr/local/bin/`
  footer: |
    **Full Changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}/compare/{{ .PreviousTag }}...{{ .Tag }}
    
    ---
    
    **UPX Compression Status**:
    - Linux: {{ if eq .Env.ENABLE_UPX_LINUX "true" }}**enabled**{{ else }}**disabled**{{ end }}
    - Windows: {{ if eq .Env.ENABLE_UPX_WINDOWS "true" }}**enabled**{{ else }}**disabled**{{ end }}
    - macOS Intel: {{ if eq .Env.ENABLE_UPX_DARWIN_INTEL "true" }}**enabled**{{ else }}**disabled**{{ end }}
    - macOS ARM: {{ if eq .Env.ENABLE_UPX_DARWIN_ARM "true" }}**enabled**{{ else }}**disabled** (recommended){{ end }}